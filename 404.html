<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Kanji has moved to learnkanji.app</title>
<link rel="canonical" href="https://learnkanji.app/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://learnkanji.app/">
<style>
:root { --bg: #f4f6f1; --fg: #1d2420; --accent: #1a6a53; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #1b2622; --fg: #edf3ec; --accent: #8dd5b9; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding-block: 56px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 28px; line-height: 1.2; margin: 0; }
a { color: var(--accent); }
</style>
</head>
<body>
<!-- Learn Kanji's earlier address: every page that is no longer here leads to the new address. -->
<main><h1>Learn Kanji has moved to <a href="https://learnkanji.app/">learnkanji.app</a></h1></main>
<script>location.replace('https://learnkanji.app/');</script>
</body>
</html>
